services:
  dropcatch:
    build: .
    image: dropcatch:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/dropcatch.db
      LISTEN_ADDR: ":8080"
      WHOIS_URL: ${WHOIS_URL-http://whois}
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - dropcatch-data:/data
    depends_on:
      whois:
        condition: service_healthy
        required: false
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # WHOIS / RDAP / web-WHOIS lookup service: reg233/whois-domain-lookup
  # (upstream commit 3bfffeb) vendored in whois-sidecar/ with dropcatch
  # patches (RDAP cache busting, see whois-sidecar/PATCHES.md).
  # Internal only: not published on the host.
  whois:
    build:
      context: ./whois-sidecar
    image: dropcatch-whois:latest
    restart: unless-stopped
    environment:
      SITE_PASSWORD: ${WHOIS_PASSWORD:-}
      USER_AGENT: ${WHOIS_USER_AGENT:-}
      CACHE_BUST_RDAP_HOSTS: ${CACHE_BUST_RDAP_HOSTS:-}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  dropcatch-data:
